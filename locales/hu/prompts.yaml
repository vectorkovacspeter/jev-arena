  fresh_choice: {"Billing": "Számlázás", "Engineering": "Műszaki", "Success": "Ügyfélsiker", "Proceed": "Folytatás", "Review": "Felülvizsgálat", "Stop": "Leállítás", "Supported": "Alátámasztott", "Contradicted": "Ellentmondó", "Insufficient evidence": "Nincs elég bizonyíték", "Reader": "Olvasó", "Editor": "Szerkesztő", "Request approval": "Jóváhagyás kérése", "Secure review": "Biztonsági felülvizsgálat", "Intake": "Iktatás", "Archive": "Archívum", "Relevant": "Releváns", "Not relevant": "Nem releváns", "Active": "Aktív", "Inactive": "Inaktív", "Unknown": "Ismeretlen", "Critical": "Kritikus", "Warning": "Figyelmeztetés", "Healthy": "Rendben"}
  directions: {"north": "", "east": "", "south": "", "west": ""}
  ticket_queues: {"Billing": "", "Engineering": "", "Success": "", "Review": ""}
  sentiment: {"negative": "", "positive": ""}
  nli: {"entailment": "", "neutral": "", "contradiction": ""}
  sib_topics: {}
