    question: importers.massive
    question_id: intent
    licence: CC-BY-4.0
  scifact:
    source: translated
    pack: RAG relevance
    family: SciFact
    sample: 500
    question: importers.scifact
    state: importers.scifact_state
    engine: opus-mt
  fresh:
    source: generated
    pack: Arena Fresh
    family: Arena Fresh
  robustness:
    source: generated
    pack: Robustness
    family: Robustness
  episodes:
    source: generated
    pack: Episodes
    family: Warehouse / Ticket workflow
    reason: dynamic; one case per episode step, not part of the Full preset count
  abcd:
    source: missing
    pack: ABCD next action
    family: ABCD
    reason: separate frozen assessment; Hungarian ABCD is a follow-up
